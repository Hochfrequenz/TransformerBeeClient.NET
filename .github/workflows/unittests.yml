name: Unit Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          # global.json pins SDK 11; the 10.0 runtime is needed to run the net10.0 test targets
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Install dependencies
        working-directory: TransformerBeeClient
        run: dotnet restore TransformerBeeClient.sln

      - name: Build
        working-directory: TransformerBeeClient
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit Tests
        working-directory: TransformerBeeClient/TransformerBeeClient.UnitTest
        run: |
          dotnet test
